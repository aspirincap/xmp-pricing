<!DOCTYPE html>
<html>
<head>
    <title>Eval Review</title>
    <style>
        body { font-family: monospace; max-width: 1000px; margin: 20px auto; }
        .eval { border: 1px solid #ccc; margin: 10px 0; padding: 10px; }
        .prompt { background: #f0f0f0; padding: 5px; }
        .result { margin-top: 10px; }
        .pass { color: green; }
        .fail { color: red; }
    </style>
</head>
<body>
    <h1>Eval Review</h1>
    <p>Total evals: 2</p>

    <div class="eval">
        <div class="prompt"><strong>Eval 1</strong> <span class='pass'>✓ PASS</span></div>
        <p>基础版 + API + 一个大媒体（使用 xmp-business-quote Skill）</p>
    </div>

    <div class="eval">
        <div class="prompt"><strong>Eval 2</strong> <span class='fail'>✗ FAIL</span></div>
        <p>基础版 + API + 一个大媒体（不提供 Skill 或内部价格表）</p>
    </div>

</body>
</html>
